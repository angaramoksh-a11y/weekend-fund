    var set = function(id, base){ var a = document.getElementById(id); if(a) a.href = base + q; };
    set('vp-chatgpt',    'https://chatgpt.com/?q=');
    set('vp-claude',     'https://claude.ai/new?q=');
    set('vp-perplexity', 'https://www.perplexity.ai/search?q=');

    function focusables(){
      return Array.prototype.slice.call(
        el.querySelectorAll('a[href], button:not([hidden]), [tabindex]:not([tabindex="-1"])')
      ).filter(function(n){ return n.offsetParent !== null || n === document.activeElement; });
    }
    function onKeydown(e){
      if(e.key === 'Escape'){ minimize(true); return; }
      if(e.key !== 'Tab') return;
      var f = focusables(); if(!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
    function onDocClick(e){
      if(el.classList.contains('is-open') && !el.contains(e.target) && e.target !== fab && !fab.contains(e.target)){
        minimize(false);
      }
    }
    function open(){
      el.classList.add('is-open');
      fab.hidden = true;
      document.addEventListener('keydown', onKeydown, true);
      setTimeout(function(){ document.addEventListener('click', onDocClick, true); }, 0);
      var c = el.querySelector('.vp-close'); if(c) c.focus();
    }
    function minimize(persist){
      el.classList.remove('is-open');
      fab.hidden = false;
      document.removeEventListener('keydown', onKeydown, true);
      document.removeEventListener('click', onDocClick, true);
      if(persist) remember();
    }
    var closeBtn = el.querySelector('.vp-close');
    if(closeBtn) closeBtn.addEventListener('click', function(){ minimize(true); });
    fab.addEventListener('click', open);

    if(STATIC){ open(); }
    else { fab.hidden = false; if(!minimizedRecently()) setTimeout(open, 10000); }
  }

  if(document.readyState === 'complete') build();
  else window.addEventListener('load', build);
})();
/* ===== end varv-popup-js ===== */

</script>
